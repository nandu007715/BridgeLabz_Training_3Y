<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <!-- Google Map embedded using iframe -->
    <!-- loading="lazy" loads the map when it is near the visible area -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University+Mathura&output=embed"
        title="Google Map of GLA University"
        width="80%"
        height="400"
        loading="lazy">
    </iframe>

</body>
</html>
