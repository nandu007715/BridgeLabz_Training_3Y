<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>

    <h2>File Upload Form</h2>

    <form>

        <label for="file">Choose File:</label>
        <input
            type="file"
            id="file"
            name="file"
            accept=".jpg,.png">

        <p>Only JPG and PNG files are allowed.</p>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
