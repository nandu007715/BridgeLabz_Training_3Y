<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two iFrames</title>
</head>
<body>

    <!-- First iframe: Introduction -->
    <iframe
        srcdoc="<h2>My Introduction</h2><p>My name is Nandini Singh. I am a B.Tech student interested in cybersecurity and software development.</p>"
        width="80%"
        height="200">
    </iframe>

    <br><br>

    <!-- Second iframe: Favourite Hobby -->
    <iframe
        srcdoc="<h2>My Favourite Hobby</h2><p>My favourite hobby is listening to music and learning new technologies.</p>"
        width="80%"
        height="200">
    </iframe>

</body>
</html>
