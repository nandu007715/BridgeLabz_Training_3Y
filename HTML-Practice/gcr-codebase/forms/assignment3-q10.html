    <!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>

<body>

    <h1>My Selection</h1>

    <label>Country:</label>

    <select>
        <option selected>India</option>
        <option>USA</option>
        <option>UK</option>
    </select>

    <br><br>

    <label>State:</label>

    <select>
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label>City:</label>

    <select>
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
    </select>

    <br><br>

    <label>Favourite Tourist Place:</label>

    <select>
        <option selected>Taj Mahal</option>
        <option>Goa</option>
        <option>Jaipur</option>
    </select>

    <p>
        I live in India, Uttar Pradesh and my city is Mathura.
        My favourite tourist place is the Taj Mahal.
    </p>

</body>
</html>
