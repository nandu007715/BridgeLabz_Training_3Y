<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(6).css">
</head>
<body>

    <main class="container py-5">

        <h1 class="text-center fw-bold mb-4">Notifications Dashboard</h1>

        <div class="alert alert-success" role="alert">
            <strong>Success!</strong> Your profile was updated successfully.
        </div>

        <div class="alert alert-info" role="alert">
            <strong>Information:</strong> Your assignment is due soon.
        </div>

        <div class="alert alert-danger" role="alert">
            <strong>Warning!</strong> Your account requires verification.
        </div>

        <!-- Dismissible alert requires Bootstrap JavaScript -->
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <strong>Reminder:</strong> Please complete your pending tasks.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Bootstrap 3 called this a Well; here it is recreated with Bootstrap 5 utilities. -->
        <section class="summary bg-light border rounded p-4 mt-4">
            <h2 class="h4 fw-bold">Notification Summary</h2>
            <p class="mb-0">You have 3 important notifications and 2 pending tasks.</p>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
