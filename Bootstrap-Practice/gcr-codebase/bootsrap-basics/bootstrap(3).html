<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(3).css">
</head>
<body>

    <main class="container py-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold">Product Catalog</h1>
            <p class="text-muted">Latest technology products.</p>
        </header>

        <!-- col-md-3 gives four columns on medium and larger screens -->
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Laptop">
                    <div class="card-body text-center">
                        <h2 class="h5">Smart Laptop</h2>
                        <p class="fw-bold text-primary">₹55,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Smartphone">
                    <div class="card-body text-center">
                        <h2 class="h5">Smart Phone</h2>
                        <p class="fw-bold text-primary">₹24,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Headphones">
                    <div class="card-body text-center">
                        <h2 class="h5">Wireless Headphones</h2>
                        <p class="fw-bold text-primary">₹2,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Smart Watch">
                    <div class="card-body text-center">
                        <h2 class="h5">Smart Watch</h2>
                        <p class="fw-bold text-primary">₹4,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </article>
            </div>

        </div>
    </main>

</body>
</html>
