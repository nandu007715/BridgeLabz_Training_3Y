<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(2).css">
</head>
<body>

    <main class="container py-5">

        <header class="text-center mb-5">
            <h1 class="fw-bold">Nandini Singh</h1>
            <p class="lead">Cybersecurity & Software Development Enthusiast</p>
        </header>

        <div class="row align-items-center g-4">
            <div class="col-12 col-md-4 text-center">
                <!-- img-fluid keeps the image responsive -->
                <img src="https://via.placeholder.com/250"
                     alt="Profile Image"
                     class="img-fluid rounded-circle profile-image">
            </div>

            <div class="col-12 col-md-8">
                <h2 class="fw-bold">About Me</h2>
                <p>I enjoy learning cybersecurity, artificial intelligence and software development.</p>

                <a href="#" class="btn btn-primary me-2">Hire Me</a>
                <button class="btn btn-outline-primary">Download CV</button>

                <form class="mt-4">
                    <label for="email" class="form-label">Contact Email</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="Enter your email">
                </form>
            </div>
        </div>

    </main>

</body>
</html>
