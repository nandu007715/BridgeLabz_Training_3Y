<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 - Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(4).css">
</head>
<body>

    <main class="container py-5">

        <header class="text-center mb-4">
            <h1 class="fw-bold">The Food Corner</h1>
            <p class="lead">Delicious food made with fresh ingredients.</p>
        </header>

        <div class="row g-4">

            <div class="col-12 col-lg-8">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>Category</th>
                                <th>Item</th>
                                <th>Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>Starter</td><td>Paneer Tikka</td><td>₹180</td></tr>
                            <tr><td>Main Course</td><td>Veg Biryani</td><td>₹220</td></tr>
                            <tr><td>Main Course</td><td>Paneer Butter Masala</td><td>₹240</td></tr>
                            <tr><td>Dessert</td><td>Gulab Jamun</td><td>₹100</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <aside class="col-12 col-lg-4">
                <h2 class="h4 fw-bold">Chef's Specials</h2>
                <ul class="list-group">
                    <li class="list-group-item">Special Paneer Tikka</li>
                    <li class="list-group-item">Royal Veg Biryani</li>
                    <li class="list-group-item">Chocolate Brownie</li>
                </ul>
            </aside>

        </div>

        <figure class="text-center mt-5">
            <img src="https://via.placeholder.com/700x300"
                 alt="Restaurant Food" class="img-fluid rounded">
            <figcaption class="mt-2 text-muted">Fresh food served every day.</figcaption>
        </figure>

    </main>

</body>
</html>
