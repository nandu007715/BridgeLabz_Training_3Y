<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(7).css">
</head>
<body>

    <main class="container py-5">

        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">Task Tracker</h1>
            <span class="badge bg-danger fs-6">Pending: 3</span>
        </header>

        <div class="list-group">

            <div class="list-group-item d-flex justify-content-between align-items-center">
                Complete HTML Assignment
                <span class="badge bg-danger">High</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                Practice Bootstrap Grid
                <span class="badge bg-warning text-dark">Medium</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                Read CSS Notes
                <span class="badge bg-success">Low</span>
            </div>

        </div>

        <button class="btn btn-success mt-4">
            Completed
            <span class="badge bg-light text-dark">5</span>
        </button>

    </main>

</body>
</html>
