<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(8).css">
</head>
<body>

    <main class="container py-5">

        <header class="text-center mb-5">
            <h1 class="fw-bold">Pricing Plans</h1>
            <p class="text-muted">Choose a plan according to your needs.</p>
        </header>

        <div class="row g-4">

            <div class="col-12 col-md-4">
                <article class="card pricing-card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h2 class="h3">Basic</h2>
                        <p class="display-6 fw-bold">₹299 <small class="fs-6">/month</small></p>
                        <ul class="list-group list-group-flush my-4">
                            <li class="list-group-item">5 Projects</li>
                            <li class="list-group-item">5 GB Storage</li>
                            <li class="list-group-item">Email Support</li>
                        </ul>
                        <button class="btn btn-outline-primary">Choose Plan</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-md-4">
                <article class="card pricing-card h-100 bg-primary text-white shadow-lg">
                    <div class="card-body text-center">
                        <span class="badge bg-light text-primary mb-2">Popular</span>
                        <h2 class="h3">Pro</h2>
                        <p class="display-6 fw-bold">₹599 <small class="fs-6">/month</small></p>
                        <ul class="list-group list-group-flush my-4">
                            <li class="list-group-item">20 Projects</li>
                            <li class="list-group-item">50 GB Storage</li>
                            <li class="list-group-item">Priority Support</li>
                        </ul>
                        <button class="btn btn-light text-primary">Choose Plan</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-md-4">
                <article class="card pricing-card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h2 class="h3">Premium</h2>
                        <p class="display-6 fw-bold">₹999 <small class="fs-6">/month</small></p>
                        <ul class="list-group list-group-flush my-4">
                            <li class="list-group-item">Unlimited Projects</li>
                            <li class="list-group-item">200 GB Storage</li>
                            <li class="list-group-item">24/7 Support</li>
                        </ul>
                        <button class="btn btn-outline-primary">Choose Plan</button>
                    </div>
                </article>
            </div>

        </div>

    </main>

</body>
</html>
