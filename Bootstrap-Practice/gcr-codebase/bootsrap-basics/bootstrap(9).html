<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap(9).css">
</head>
<body>

    <main class="container py-5">

        <header class="text-center mb-4">
            <h1 class="fw-bold">Blog Articles</h1>
        </header>

        <article class="card shadow-sm mx-auto article-card">
            <div class="card-body">
                <h2 class="h3">Getting Started with Bootstrap</h2>
                <p>
                    Bootstrap provides a responsive grid system and reusable
                    components for modern web development.
                </p>
            </div>
        </article>

        <!-- Bootstrap pagination -->
        <nav aria-label="Blog pagination" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item">
                    <a class="page-link" href="#">Previous</a>
                </li>
                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>

        <!-- Bootstrap 5 removed the old .pager class, so buttons are used for the pager requirement. -->
        <div class="d-flex justify-content-between mt-4">
            <button class="btn btn-outline-secondary">← Older Posts</button>
            <button class="btn btn-outline-secondary">Newer Posts →</button>
        </div>

    </main>

</body>
</html>
